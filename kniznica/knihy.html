<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kniznica</title>
    
    <link rel="stylesheet" href="style.css">
    <script src="knihy.js" defer></script>
    <script src="app.js" defer></script>
    
</head>
<body>
    <div class="main">
  <div class="nav">
    <main>
        <h1>moje Knihy</h1>
        <form id="knihyForm">
    <input id="nazov" placeholder="Nazov knihy" required>
    <input id="autor" placeholder="Autor knihy" required>
    <input id="rok" type="number" placeholder="Rok vydania" required>
    <input id="cena" type="number" step="0.01" placeholder="Cena knihy" required>
    <button type="submit">Pridat knihu</button>
</form>
<table border="1" cellpadding="8">
    <thead>
        <tr>
            <th>ID</th>
            <th>Nazov</th>
            <th>Autor</th>
            <th>Rok vydania</th>
            <th>Cena</th>
        </tr>
    </thead>
    <tbody id="zoznam"></tbody>
</table>
    </main>
     </div>
</div>
</body>
</html>
